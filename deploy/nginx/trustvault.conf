# Example TLS reverse-proxy site. Replace vault.example.com and certificate
# paths before enabling. TrustVault itself must bind only to 127.0.0.1.
server {
    listen 80;
    listen [::]:80;
    server_name vault.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name vault.example.com;

    ssl_certificate     /etc/letsencrypt/live/vault.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vault.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    client_max_body_size 11m;
    client_body_timeout 20s;
    client_header_timeout 15s;
    keepalive_timeout 30s;
    limit_conn trustvault_per_ip 20;
    limit_req_status 429;
    limit_conn_status 429;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;

    location = /api/auth/login {
        limit_req zone=trustvault_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/snippets/trustvault-proxy-headers.conf;
    }

    location = /api/auth/signup {
        limit_req zone=trustvault_signup burst=3 nodelay;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/snippets/trustvault-proxy-headers.conf;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/snippets/trustvault-proxy-headers.conf;
    }
}
