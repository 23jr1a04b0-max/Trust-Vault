# Include this file inside nginx's http {} context.
# These zones are shared by all virtual hosts handled by this single Nginx instance.
limit_req_zone $binary_remote_addr zone=trustvault_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=trustvault_signup:10m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=trustvault_per_ip:10m;
