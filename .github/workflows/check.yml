name: TrustVault checks
on:
  # Pull requests validate feature branches; push runs are reserved for main
  # to avoid duplicate checks for each commit on an open pull request.
  push:
    branches: ["main"]
  pull_request:
permissions:
  contents: read
concurrency:
  group: trustvault-check-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm run check
      - name: Validate backup script syntax
        run: bash -n scripts/backup.sh
      - name: Build and smoke-test production container
        shell: bash
        run: |
          AUDIT_HMAC_KEY=test-only-ci-audit-key-at-least-32-bytes TRUSTED_ORIGINS=https://vault.example.test AUDIT_SINK_URL=https://audit.example.test/ingest AUDIT_SINK_TOKEN=test-only-ci-audit-sink-token-at-least-32-bytes docker compose config --quiet
          docker build --tag trustvault:ci .
          docker run --detach --name trustvault-ci --publish 127.0.0.1:3000:3000 \
            --env NODE_ENV=production \
            --env AUDIT_HMAC_KEY=test-only-ci-audit-key-at-least-32-bytes \
            --env TRUSTED_ORIGINS=https://vault.example.test \
            --env AUDIT_SINK_URL=https://audit.example.test/ingest \
            --env AUDIT_SINK_TOKEN=test-only-ci-audit-sink-token-at-least-32-bytes \
            trustvault:ci
          for attempt in $(seq 1 30); do
            if node -e "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then
              docker rm --force trustvault-ci
              exit 0
            fi
            sleep 1
          done
          docker logs trustvault-ci
          docker rm --force trustvault-ci
          exit 1
